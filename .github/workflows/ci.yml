name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: versions
        run: |
          git --version
          /bin/bash --version | head -n 1
      # /bin/bash: bash 3.2 on macOS, which is the compatibility target.
      - name: tests
        run: |
          /bin/bash tests/run.sh | tee test.log
          grep -Eq '^tests: ([0-9]+)/\1 passed$' test.log
      # The page logic must have run, under JXA on macOS (the fallback that
      # the user's Mac relies on) and under node on ubuntu.
      - name: view js runtime
        run: |
          if [ "$RUNNER_OS" = macOS ]; then want=osascript; else want=node; fi
          grep -Eq "^view js: $want" test.log

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to the version used locally: the runner's older shellcheck
      # (0.9) flags `[ a ] && [ b ] || c` (SC2015), which 0.11 accepts.
      - name: install shellcheck
        run: |
          v=v0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$v/shellcheck-$v.linux.x86_64.tar.xz" | tar -xJ
          echo "$PWD/shellcheck-$v" >> "$GITHUB_PATH"
      - run: shellcheck --version && shellcheck bin/git-salvage shim/git tests/run.sh dev/*.sh
